{{- if not .Values.truenas.existingSecret }}
# Rendered only when no existing Secret was supplied.
#
# Note that a key set via `truenas.apiKey` is also stored in the Helm release
# secret, in clear text, for as long as that revision is retained. Using
# `truenas.existingSecret` avoids that entirely and is the recommended path for
# anything beyond a quick trial.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "truenas-scale-exporter.fullname" . }}
  labels:
    {{- include "truenas-scale-exporter.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.truenas.apiKey | quote }}
{{- end }}
