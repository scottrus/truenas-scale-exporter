{{- include "truenas-scale-exporter.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "truenas-scale-exporter.fullname" . }}
  labels:
    {{- include "truenas-scale-exporter.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "truenas-scale-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "truenas-scale-exporter.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if not .Values.truenas.existingSecret }}
        # Roll the pod when the rendered Secret changes, so a rotated key is
        # actually picked up instead of silently ignored until the next restart.
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "truenas-scale-exporter.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      # The kubelet otherwise injects a legacy Docker-link variable for every
      # Service in the namespace. A Service named `truenas-exporter` yields
      # TRUENAS_EXPORTER_PORT=tcp://<ip>:9819, which collides exactly with this
      # exporter's own port setting and kills the container at startup. The
      # exporter needs none of these variables.
      enableServiceLinks: {{ .Values.enableServiceLinks }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --url=$(TRUENAS_URL)
            - --api-key-file=/etc/truenas/api-key
            - --port={{ .Values.service.port }}
            {{- if .Values.truenas.insecure }}
            - --insecure
            {{- end }}
            - --timeout={{ .Values.truenas.timeout }}
            - --log-level={{ .Values.logLevel }}
            {{- with .Values.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: TRUENAS_URL
              value: {{ .Values.truenas.url | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: api-key
              mountPath: /etc/truenas
              readOnly: true
      volumes:
        - name: api-key
          secret:
            secretName: {{ include "truenas-scale-exporter.secretName" . }}
            items:
              - key: {{ include "truenas-scale-exporter.secretKey" . }}
                path: api-key
            defaultMode: 0400
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
