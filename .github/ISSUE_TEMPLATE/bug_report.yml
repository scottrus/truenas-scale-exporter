name: Bug report
description: Something is wrong or a metric is missing
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: please **do not paste an API key**, and scrub disk
        serial numbers from any metric output if you would rather not have
        them public.

  - type: input
    id: truenas-version
    attributes:
      label: TrueNAS version
      placeholder: "25.10.5"
    validations:
      required: true

  - type: input
    id: exporter-version
    attributes:
      label: Exporter version
      placeholder: "0.1.0, or the image tag you are running"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: How is it deployed?
      options:
        - Helm chart on Kubernetes
        - Docker / Compose
        - Python package directly
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Output of `--once`
      description: |
        Run the exporter with `--once` and paste the relevant part. Start with
        `truenas_up` and `truenas_collector_success` — they narrow it down fast.
      render: shell

  - type: textarea
    id: topology
    attributes:
      label: Pool topology
      description: |
        Only if the bug involves pools or devices. `zpool status` is usually
        enough. Rename pools and remove serials if you prefer.
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Run with `--log-level=DEBUG` if the cause is not obvious.
      render: shell
