[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "truenas-scale-exporter"
dynamic = ["version"]
description = "Prometheus exporter for TrueNAS, over the JSON-RPC 2.0 WebSocket API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Scott Russell" }]
keywords = ["prometheus", "exporter", "truenas", "zfs", "monitoring"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "prometheus-client>=0.20,<1.0",
  # 14.0 is the floor because the sync client's `ssl` keyword (which replaced
  # `ssl_context`) is what client.py passes. CI resolves the newest version, so
  # a wider range would claim support for something never exercised.
  "websockets>=14.0,<16.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "pylint>=3.2",
  "PyYAML>=6.0",
]

[project.scripts]
truenas-scale-exporter = "truenas_scale_exporter.__main__:main"

[project.urls]
Homepage = "https://github.com/scottrus/truenas-scale-exporter"
Issues = "https://github.com/scottrus/truenas-scale-exporter/issues"

[tool.hatch.version]
path = "src/truenas_scale_exporter/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/truenas_scale_exporter"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.ruff.lint.per-file-ignores]
# Assertions that name a metric and its full label set read better on one line
# than wrapped across four.
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The floor sits below current coverage rather than at it, so ordinary changes
# are not blocked by rounding — it exists to catch a real regression, not to
# chase a number. main()'s serve_forever loop is the bulk of what is uncovered.
addopts = "--cov=truenas_scale_exporter --cov-report=term-missing --cov-fail-under=80"

[tool.pylint.main]
py-version = "3.11"

[tool.pylint."messages control"]
disable = [
  # Ruff already enforces these, and it disagrees with pylint on wrapping.
  "line-too-long",
  # Every module, class and public method here has a docstring where it earns
  # one; pylint's blanket requirement adds noise to small helpers.
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  # The collector legitimately builds many metric families in one function.
  "too-many-locals",
  "too-many-statements",
  "too-many-branches",
  "too-many-arguments",
  "too-many-positional-arguments",
  "too-few-public-methods",
  # Broad excepts are deliberate and commented at each site: one failing
  # sub-collector must not take down the whole scrape.
  "broad-exception-caught",
  "duplicate-code",
]

[tool.pylint.design]
max-attributes = 12
